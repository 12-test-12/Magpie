# Magpie 打包与依赖边界（2.1 第 4 件事）。
#
# 改这个文件前先读两条硬约束：
#   * 工程解释器 = 当前 `python`（**3.9.1**，D:\shiyanshi\python\python.exe），见 2.1
#     决策 1。`requires-python = ">=3.9"` 是**记录事实**，不是"我们支持 3.9 及以上"
#     的宣言 —— 真正要守的是"不使用 3.10+ 运行时特性"，那条由 `check.py lint` 的
#     P39 规则守着。
#   * `dependencies` 必须保持为空：core 只用标准库（红线 R6，同样由 check.py lint
#     守）。新依赖一律进下面的 extras，且只能在 parser / api 内部 lazy import，
#     绝不出现在 core 顶层。

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "magpie"
version = "0.1.0"        # 与 magpie/__init__.py 的 __version__ 保持一致
description = "自用的资源统筹工具（SRC / 渗透测试场景的资产与情报整合工作台）。仅用于自有资产与已获授权的目标。"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
# 本地 API 层（阶段 2.7 起）。3.9 是老解释器：届时若新版 FastAPI / uvicorn /
# pydantic v2 抬高了 Python 下限，就在这里钉住最后一个仍支持 3.9 的版本，
# 并把"为什么钉"写进注释 —— 这正是 2.1 决策 1 已知的代价之一。
api = ["fastapi", "uvicorn"]
api-yaml = ["pyyaml"]
# 阶段 4.5 的收口点（流量 / 接口文件解析）。目前那块解析走标准库，故为空；
# 真需要第三方时加在这里，core 仍然不得 import 它。
traffic = []
dev = ["pytest"]

[project.scripts]
# 2.5 的最小触发入口需要一个稳定的调用点，所以 CLI 虽已后置，这个入口先立住。
magpie = "magpie.cli:main"

[tool.setuptools]
# 显式列出，关掉 setuptools 的 flat-layout 自动发现：仓库根还躺着 check.py、
# verify_*.py、generate_docx.py，自动发现会把它们也当成顶层模块并直接报错。
# magpie/core/tests/ 刻意**不**打包 —— 它是回归网，不是运行时的一部分。
packages = ["magpie", "magpie.core"]
