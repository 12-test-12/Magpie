# Magpie 打包与依赖边界（2.1 第 4 件事）。
#
# 改这个文件前先读两条硬约束：
#   * 工程解释器 = **`py -3.13`**（3.13.15）。一律显式调用，不要依赖 PATH 顺序 ——
#     本机 `python` 是 3.9.1，两者不是一个东西。`requires-python = ">=3.11"` 是
#     语言**下限**（回到文档原值），与"用哪个解释器开发"是两回事。
#     ⚠️ 这里的 `>=3.11` 是 `check.py lint` 的 FLOOR 规则**唯一事实来源** ——
#     check.py 直接读这一行，不再另写一份版本号。改这里，规则跟着改。
#   * `dependencies` 必须保持为空：core 只用标准库（红线 R6，同样由 check.py lint
#     守）。新依赖一律进下面的 extras，且只能在 parser / api 内部 lazy import，
#     绝不出现在 core 顶层。

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "magpie"
version = "0.31.0"       # 本地研究资料与入口完善
# 0.1.0 → 0.2.0 对应 2.7：**纯新增**（magpie/api + SSE + `magpie app`）。
# `/api/v1` 的响应形状从这一刻起是对外契约 —— 改它要升 minor 并写 CHANGELOG。
# 0.2.0 → 0.3.0 对应 2.8：GUI 只读画布 + 作业历史/undo/redo 四个端点（**纯新增**）。
# 0.3.0 → 0.4.0 对应 2.2：CLI 只读骨架。`--json` 信封与退出码表（0/1/2/3/4/5
# ↔ HTTP 2xx/400/404/409/423/426）从这一刻起是对外契约。
# 0.4.0 → 0.5.0 对应 2.6：CLI 写路径（project create / import / undo / redo /
# jobs）。**纯新增命令，没有增删任何一条路由** —— `/api/v1` 一行未改，openapi
# 快照因此仍然只差 `info.version`。见 CHANGELOG。
# 0.5.0 → 0.6.0 对应 3.6：数据体检页 + Inbox 页。动了 `/doctor` 的既有响应
# （加一个 `health` 键）—— 阶段 3 里第一次改到既有形状，见 CHANGELOG。
# 0.6.0 → 0.7.0 对应 3.7b：编排模式（管线定义 + 批量跑 + 批量 undo）。十条
# `/pipelines` `/runs` 路由从 501 变真端点（纯新增），外加一处改到既有响应
# （`/jobs/{id}` 的 `data` 多一个 `pipeline_run_id`）—— 两条都在 CHANGELOG 的
# `0.7.0` 一节登记。
# 0.9.0 → 0.10.0 对应 4.4：时间线 / 导出打包（`magpie timeline` / `magpie export`
# 两条**纯新增** CLI 命令 + `core/export.py`）。`/api/v1` 一行未改 —— openapi
# 快照只差 `info.version`；本步动的既有面是 0.9.0 第 2 条留下的体检页 custody
# 标签（前端模板，非 API）。见 CHANGELOG 的 `0.10.0` 一节。
# 0.10.0 → 0.11.0 对应 4.5：可选 extras 收口 —— `magpie schema --json` 的 data
# **纯新增**一个 `extras` 键（有哪些 / 装没装 / 怎么装 / 各自干嘛）。`/api/v1`
# 一行未改 —— openapi 快照只差 `info.version`（已重新生成）。没有新增迁移
# （R4 未动）。见 CHANGELOG 的 `0.11.0` 一节。
# 0.11.0 → 0.12.0 对应 5.2：schema 收口 —— `magpie schema --json` 的 data
# **纯新增**四个键（`tool_version` / `commands` / `enums` / `parsers`），既有键
# 一字未动。`/api/v1` 一行未改（`/meta` 改用共用的 `ingest.parser_catalog()`，
# 响应形状不变）—— openapi 快照只差 `info.version`。没有新增迁移（R4 未动）。
# 见 CHANGELOG 的 `0.12.0` 一节。
# 0.12.0 → 0.13.0 对应 5.1：MCP 适配器 —— 新增 stdio 只读传输面（
# `magpie/adapters/mcp.py`，工具清单从 schema 契约派生）。`/api/v1` 一行未改
# —— openapi 快照只差 `info.version`。没有新增迁移（R4 未动）。
# 见 CHANGELOG 的 `0.13.0` 一节。
# 0.13.0 → 0.14.0 对应 5.5：风险评分与攻击面概览 —— **纯新增**一条
# `GET /api/v1/risk` + CLI 命令 `magpie risk`（同一段 `core/risk.overview`）。
# openapi 快照重新生成（新路径 + `info.version`）。没有新增迁移（R4 未动）；
# 既有路由 / 既有命令的形状一字未动。见 CHANGELOG 的 `0.14.0` 一节。
# 0.14.0 → 0.15.0 对应 5.4：`magpie ask` —— **纯新增**一条 CLI 命令（默认关闭的
# 唯一出站点，R7 四向白名单化）。`/api/v1` 一行未改 —— openapi 快照只差
# `info.version`（已重新生成）。没有新增迁移（R4 未动）；既有命令的键、退出码、
# 信封一字未动（ask 的失败只落冻结档位 1 与 2，不新增第 6 档）。
# 见 CHANGELOG 的 `0.15.0` 一节。
# 0.15.0 → 0.16.0：**纯新增**一条 `GET /api/v1/fs`（导入对话框「浏览…」的
# 目录浏览，只列不读）。openapi 快照重新生成（新路径 + `info.version`）。
# 没有新增迁移（R4 未动）；既有路由的形状一字未动，GUI 手填路径那条路不变。
# 见 CHANGELOG 的 `0.16.0` 一节。
# 0.16.0 → 0.17.0：**纯新增**一条 `POST /api/v1/uploads`（原生选择器 / 拖拽上传
# 的暂存区，multipart `files` → `{files:[{name,path,bytes}],count}`）+ extras
# `api` 补 `python-multipart`。openapi 快照重新生成。见 CHANGELOG 的 `0.17.0` 一节。
# 0.17.0 → 0.18.0：**既有响应加键**（照 0.6.0 先例登记）—— `GET /jobs` 与
# `GET /jobs/{id}` 的作业行各加 `source_files: [{name, path}]`（原文定位，取自
# contributions→evidence→raw_files，name 优先 coverage_scope.file）。既有键
# 一字未删；`magpie jobs --json` 的列不受影响（CLI 有自己的 _JOB_COLUMNS 副本）。
# 没有新增迁移（R4 未动）。openapi 快照重新生成（info.version）。见 CHANGELOG。
description = "自用的资源统筹工具（SRC / 渗透测试场景的资产与情报整合工作台）。仅用于自有资产与已获授权的目标。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# 本地 API 层（阶段 2.7 起）。若新版 FastAPI / uvicorn / pydantic v2 抬高了
# Python 下限（超过 3.11），就在这里钉住最后一个仍兼容的版本，并把"为什么钉"
# 写进注释 —— 不允许悄悄把 requires-python 抬上去。
#
# 刻意**不钉版本**（现状：fastapi 0.141.1 / uvicorn 0.52.1 / pydantic 2.13.4，
# 都在 3.11 上装得动）。钉住能让 openapi 快照更"稳"，但那恰好把它要买的东西
# 一起钉死了：升级带来的**契约漂移**会一直藏着，直到某天在某个消费者那里爆炸。
# 让快照在升级时红一次，正是 test_contract_openapi.py 本来要换来的信号。
#
# `python-multipart`（0.17.0 起）：FastAPI 只在**它自己的** `standard` extra 里
# 声明它，裸装 fastapi 时任何 multipart 表单端点（`POST /uploads`）都会在路由
# 定义时 RuntimeError —— 那种"本机好好的、新环境起不来"正是登记进 extras 要防的。
api = ["fastapi", "uvicorn", "python-multipart"]
# YAML 解析的 extras（名字沿用 3.4 的 `api-yaml`，**不新开**）：3.4 的 OpenAPI
# YAML、3.7b 的管线定义、4.3 的指纹规则都用它 —— 全部只在**函数体内** lazy
# import（R6：core 顶层 ⊆ 标准库），缺时报 `MissingExtrasError`（消息里带
# extras 名与安装命令，`pipeline run` 一行收在 stderr 不出 traceback）。
# "有哪些 extras、装没装"由 `magpie schema --json` 的 `extras` 键查给人看（4.5
# 收口），登记表与本文件逐项一致由 `test_extras_registry_matches_pyproject` 钉住。
api-yaml = ["pyyaml"]
# 阶段 4.5 的收口点（流量 / 接口文件解析）。目前那块解析走标准库，故为空；
# 真需要第三方时加在这里，core 仍然不得 import 它。
#
# ⚠️  4.1 的 `tshark` **不进这里**，而且这不是"暂时还没有"：它是一个**外部可
# 执行**（Wireshark 的命令行），不是 Python 包。`pip install -e ".[traffic]"`
# 装不出它来，把名字写进来只会把人引到一个装不出东西的地方去。缺它时的正确
# 反应是抛可读错误（说清装 Wireshark 与"本步其实不需要它"），见
# `magpie/core/parsers/tshark.py` 的 `ensure_available`。
# （这一列是空的这件事本身也是对的：4.1 的解析走的是标准库的 `json`。）
traffic = []
# `httpx2` 不是运行时依赖，是**测试台架**依赖：api 测试的 TestClient 走
# starlette.testclient，而 unpinned 装到的 starlette（1.6+）要求 httpx2 在场。
# 本机与历轮环境里它恰好早被装上，所以这个洞只在**全新环境**暴露 —— LARI-48 的
# WSL 全新 venv 实测：缺它时 api 测试 13 个文件收集期全红。与 EXTRAS_REGISTRY
# 的 dev 条目逐项一致由 test_extras_registry_matches_pyproject 钉住。
dev = ["pytest", "httpx2"]

[project.scripts]
# 2.5 的最小触发入口需要一个稳定的调用点，所以 CLI 虽已后置，这个入口先立住。
magpie = "magpie.cli:main"

[tool.setuptools]
# 显式列出，关掉 setuptools 的 flat-layout 自动发现：仓库根还躺着 check.py、
# verify_*.py，自动发现会把它们也当成顶层模块并直接报错。
# 三个 tests/ 目录刻意**不**打包 —— 它们是回归网，不是运行时的一部分。
#
# 2.2 起 `magpie/cli.py` 长成了 `magpie/cli/`：入口仍是 `magpie.cli:main`，
# 外加 `__main__.py` 让 `-m magpie.cli` 照旧可用（bench 的两条性能契约靠它）。
# 拆开不是为了好看 —— 契约（`envelope.py`）比命令活得久，分开之后"改命令时
# 顺手改到契约"这件事才需要多走一步。
#
# `magpie.adapters`（5.1 的 MCP 适配器）曾经漏在这份清单外：源码态测试一切
# 照绿（pytest 从仓库根 import 源码），但 `pip install .` 出来的 wheel 里没有
# 它 —— 一个只在"装了包才知道"的洞。LARI-48 打包时补上（构建产物同样要收它，
# 见 packaging/magpie.spec 的 hiddenimports）。
packages = ["magpie", "magpie.core", "magpie.core.parsers", "magpie.api", "magpie.cli",
            "magpie.adapters"]

[tool.setuptools.package-data]
# 静态资源随包走。**本地打包**是零出站的前提（计划书 §7.6）：页面一旦引用
# CDN，打开它的浏览器就替这个工具发起了出站请求。`check.py` 的 R7-ASSETS
# 扫描这个目录并把"引用了外部域名"变成一条会让整轮验证变红的断言。
#
# 2.8 起这里是 **Vite 的构建产物**，落在 `web/` 与 `web/assets/` 两层下，
# 所以模式必须是递归的。平铺的 `web/*.js` 收不到 `web/assets/*.js` —— 那个
# 错误的症状是"本地装了包之后 GUI 是空的"，而要等到有人真的 `pip install`
# 一次才会发现。`magpie/api/tests/test_web.py` 的 `test_web_files_are_packaged`
# 把这一行钉住（它读的就是这个文件）。
#
# 产物**入库**是刻意的：`magpie app` 不能要求用户先装 node 才能打开界面。
# 改前端之后要重新 `npm run build` 并提交产物 —— 见 `frontend/README.md`。
"magpie.api" = ["web/**/*"]
