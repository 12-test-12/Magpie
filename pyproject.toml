# Magpie 打包与依赖边界（2.1 第 4 件事）。
#
# 改这个文件前先读两条硬约束：
#   * 工程解释器 = **`py -3.13`**（3.13.15）。一律显式调用，不要依赖 PATH 顺序 ——
#     本机 `python` 是 3.9.1，两者不是一个东西。`requires-python = ">=3.11"` 是
#     语言**下限**（回到文档原值），与"用哪个解释器开发"是两回事。
#     ⚠️ 这里的 `>=3.11` 是 `check.py lint` 的 FLOOR 规则**唯一事实来源** ——
#     check.py 直接读这一行，不再另写一份版本号。改这里，规则跟着改。
#   * `dependencies` 必须保持为空：core 只用标准库（红线 R6，同样由 check.py lint
#     守）。新依赖一律进下面的 extras，且只能在 parser / api 内部 lazy import，
#     绝不出现在 core 顶层。

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "magpie"
version = "0.7.0"        # 与 magpie/__init__.py 的 __version__ 保持一致
# 0.1.0 → 0.2.0 对应 2.7：**纯新增**（magpie/api + SSE + `magpie app`）。
# `/api/v1` 的响应形状从这一刻起是对外契约 —— 改它要升 minor 并写 CHANGELOG。
# 0.2.0 → 0.3.0 对应 2.8：GUI 只读画布 + 作业历史/undo/redo 四个端点（**纯新增**）。
# 0.3.0 → 0.4.0 对应 2.2：CLI 只读骨架。`--json` 信封与退出码表（0/1/2/3/4/5
# ↔ HTTP 2xx/400/404/409/423/426）从这一刻起是对外契约。
# 0.4.0 → 0.5.0 对应 2.6：CLI 写路径（project create / import / undo / redo /
# jobs）。**纯新增命令，没有增删任何一条路由** —— `/api/v1` 一行未改，openapi
# 快照因此仍然只差 `info.version`。见 CHANGELOG。
# 0.5.0 → 0.6.0 对应 3.6：数据体检页 + Inbox 页。动了 `/doctor` 的既有响应
# （加一个 `health` 键）—— 阶段 3 里第一次改到既有形状，见 CHANGELOG。
# 0.6.0 → 0.7.0 对应 3.7b：编排模式（管线定义 + 批量跑 + 批量 undo）。十条
# `/pipelines` `/runs` 路由从 501 变真端点（纯新增），外加一处改到既有响应
# （`/jobs/{id}` 的 `data` 多一个 `pipeline_run_id`）—— 两条都在 CHANGELOG 的
# `0.7.0` 一节登记。
description = "自用的资源统筹工具（SRC / 渗透测试场景的资产与情报整合工作台）。仅用于自有资产与已获授权的目标。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# 本地 API 层（阶段 2.7 起）。若新版 FastAPI / uvicorn / pydantic v2 抬高了
# Python 下限（超过 3.11），就在这里钉住最后一个仍兼容的版本，并把"为什么钉"
# 写进注释 —— 不允许悄悄把 requires-python 抬上去。
#
# 刻意**不钉版本**（现状：fastapi 0.141.1 / uvicorn 0.52.1 / pydantic 2.13.4，
# 都在 3.11 上装得动）。钉住能让 openapi 快照更"稳"，但那恰好把它要买的东西
# 一起钉死了：升级带来的**契约漂移**会一直藏着，直到某天在某个消费者那里爆炸。
# 让快照在升级时红一次，正是 test_contract_openapi.py 本来要换来的信号。
api = ["fastapi", "uvicorn"]
api-yaml = ["pyyaml"]
# 阶段 4.5 的收口点（流量 / 接口文件解析）。目前那块解析走标准库，故为空；
# 真需要第三方时加在这里，core 仍然不得 import 它。
traffic = []
dev = ["pytest"]

[project.scripts]
# 2.5 的最小触发入口需要一个稳定的调用点，所以 CLI 虽已后置，这个入口先立住。
magpie = "magpie.cli:main"

[tool.setuptools]
# 显式列出，关掉 setuptools 的 flat-layout 自动发现：仓库根还躺着 check.py、
# verify_*.py、generate_docx.py，自动发现会把它们也当成顶层模块并直接报错。
# 三个 tests/ 目录刻意**不**打包 —— 它们是回归网，不是运行时的一部分。
#
# 2.2 起 `magpie/cli.py` 长成了 `magpie/cli/`：入口仍是 `magpie.cli:main`，
# 外加 `__main__.py` 让 `-m magpie.cli` 照旧可用（bench 的两条性能契约靠它）。
# 拆开不是为了好看 —— 契约（`envelope.py`）比命令活得久，分开之后"改命令时
# 顺手改到契约"这件事才需要多走一步。
packages = ["magpie", "magpie.core", "magpie.core.parsers", "magpie.api", "magpie.cli"]

[tool.setuptools.package-data]
# 静态资源随包走。**本地打包**是零出站的前提（计划书 §7.6）：页面一旦引用
# CDN，打开它的浏览器就替这个工具发起了出站请求。`check.py` 的 R7-ASSETS
# 扫描这个目录并把"引用了外部域名"变成一条会让整轮验证变红的断言。
#
# 2.8 起这里是 **Vite 的构建产物**，落在 `web/` 与 `web/assets/` 两层下，
# 所以模式必须是递归的。平铺的 `web/*.js` 收不到 `web/assets/*.js` —— 那个
# 错误的症状是"本地装了包之后 GUI 是空的"，而要等到有人真的 `pip install`
# 一次才会发现。`magpie/api/tests/test_web.py` 的 `test_web_files_are_packaged`
# 把这一行钉住（它读的就是这个文件）。
#
# 产物**入库**是刻意的：`magpie app` 不能要求用户先装 node 才能打开界面。
# 改前端之后要重新 `npm run build` 并提交产物 —— 见 `frontend/README.md`。
"magpie.api" = ["web/**/*"]
