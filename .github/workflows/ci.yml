name: Magpie CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install workflow parser
        run: python -m pip install PyYAML==6.0.2
      - name: Facts, versions, workflow structure and immutable migrations
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: python scripts/ci/contracts.py --base "$CI_BASE_SHA"
      - name: Existing application red lines
        run: python check.py lint
      - name: Delivery gate and artifact integrity regressions
        run: python -m unittest discover -s scripts/ci/tests -v
      - name: GitHub Actions expression and shell checks
        run: docker run --rm -v "$PWD:/repo:ro" --workdir /repo rhysd/actionlint:1.7.12 -color

  backend:
    name: Backend (${{ matrix.os }} / Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.13'}
          - {os: windows-latest, python: '3.13'}
          - {os: ubuntu-latest, python: '3.11'}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install application and coverage test tools
        run: |
          python -m pip install -e ".[dev,api,api-yaml]"
          python -m pip install pytest-cov==7.0.0
      - name: Complete existing checks, with honest pytest coverage
        shell: bash
        env:
          PYTEST_ADDOPTS: --cov=magpie --cov-append --cov-report=xml:_scratch/ci/coverage.xml
        run: |
          mkdir -p _scratch/ci
          python check.py 2>&1 | tee _scratch/ci/check.log
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: backend-${{ matrix.os }}-py${{ matrix.python }}-${{ github.sha }}
          path: _scratch/ci/
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Locked dependencies
        run: npm ci
        working-directory: frontend
      - name: Complete frontend tests
        run: npm test
        working-directory: frontend
      - name: Rebuild bundled production assets
        run: npm run build
        working-directory: frontend
      - name: Check both tracked differences and untracked build outputs
        run: python scripts/ci/contracts.py --web-only

  browser:
    name: Browser
    needs: [contracts, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install build and isolated browser tools
        env:
          BROWSER_TOOLS: ${{ runner.temp }}/magpie-browser-tools
        run: |
          python -m pip install -e ".[api,api-yaml]"
          npm ci --prefix frontend
          npm install --prefix "$BROWSER_TOOLS" --no-save --no-package-lock --ignore-scripts playwright@1.62.1
          "$BROWSER_TOOLS/node_modules/.bin/playwright" install --with-deps chromium
      - name: Real browser, isolated dev.py workspace and production page
        env:
          MAGPIE_PLAYWRIGHT_ROOT: ${{ runner.temp }}/magpie-browser-tools/node_modules
          MAGPIE_BROWSER_HEADLESS: '1'
        run: python scripts/ci/browser.py
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: browser-${{ github.sha }}
          path: _scratch/ci-browser/
          if-no-files-found: error
          retention-days: 14

  required:
    name: Required Checks
    if: always()
    needs: [contracts, backend, frontend, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every required job must actually succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          if set(results) != {'contracts', 'backend', 'frontend', 'browser'}:
              raise SystemExit('Required job results are missing')
          failed = {name: value['result'] for name, value in results.items() if value['result'] != 'success'}
          if failed:
              raise SystemExit(f'Required checks did not pass: {failed}')
          print('Contracts, all Backend environments, Frontend and Browser passed')
          PY
