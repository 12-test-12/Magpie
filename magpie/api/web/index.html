<!DOCTYPE html>
<!--
  Magpie 本地页（2.7 的静态资源占位；2.8 的 Vite 构建产物会替换它）。

  三条纪律，改这个文件时不要破：

    1. **零外部资源**。没有 CDN、没有外部字体、没有远程图标 —— 字体用系统栈，
       图形用 CSS 画。`check.py` 的 R7-ASSETS 会扫这个目录并在发现外部域名时
       让整轮验证变红。本项目的红线是"工具本身不主动发起任何网络请求"，
       一个引用 CDN 的页面会让打开它的浏览器替它违反这条红线。
    2. **token 从 URL 拿**（`?token=`），之后所有请求都带 Authorization 头。
       `EventSource` 发不了自定义头，所以 SSE 那条连接只能把 token 放查询串。
    3. **不做只能看不能用的假界面**。做不到的功能就写在"未实现"里，
       点一下弹个 501 出来。空按钮比没有按钮更让人恼火。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magpie</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --line: #2a2f3a; --fg: #e6e9ef;
    --dim: #98a2b3; --accent: #7aa2f7; --warn: #e0af68; --bad: #f7768e; --ok: #9ece6a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei",
          Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex;
           align-items: baseline; gap: 12px; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .04em; }
  header .dim { color: var(--dim); font-size: 12px; }
  main { display: grid; grid-template-columns: 340px 1fr; gap: 16px; padding: 16px 20px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
            padding: 12px 14px; }
  section h2 { font-size: 13px; margin: 0 0 10px; color: var(--dim); font-weight: 600;
               text-transform: uppercase; letter-spacing: .06em; }
  button { background: #232833; color: var(--fg); border: 1px solid var(--line);
           border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  input, textarea, select {
    width: 100%; background: #14161a; color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 8px; font: inherit; font-size: 13px;
  }
  textarea { min-height: 64px; resize: vertical; font-family: ui-monospace, Consolas, monospace; }
  label { display: block; margin: 8px 0 4px; color: var(--dim); font-size: 12px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 6px 8px; border-bottom: 1px solid var(--line); cursor: pointer;
       display: flex; justify-content: space-between; gap: 8px; }
  li:last-child { border-bottom: none; }
  li:hover { background: #202530; }
  li .k { font-family: ui-monospace, Consolas, monospace; }
  li .n { color: var(--dim); font-size: 12px; white-space: nowrap; }
  #log { font-family: ui-monospace, Consolas, monospace; font-size: 12px;
         max-height: 320px; overflow: auto; white-space: pre-wrap; }
  .tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px;
         border: 1px solid var(--line); color: var(--dim); }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  #stats { display: flex; flex-wrap: wrap; gap: 10px; }
  #stats div { background: #14161a; border: 1px solid var(--line); border-radius: 6px;
               padding: 6px 10px; font-size: 12px; }
  #stats b { color: var(--accent); font-size: 15px; display: block; }
  .notimpl { color: var(--warn); font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>
<header>
  <h1>Magpie</h1>
  <span class="dim" id="version">连接中…</span>
</header>
<main>
  <div>
    <section>
      <h2>概览</h2>
      <div id="stats"></div>
      <div class="notimpl" id="notimpl"></div>
    </section>
    <section style="margin-top:16px">
      <h2>导入</h2>
      <label for="project">项目（id 或名字）</label>
      <select id="project"></select>
      <label for="paths">文件或目录（每行一个）</label>
      <textarea id="paths" placeholder="bench/e2e/recon/subfinder.txt"></textarea>
      <label for="parser">解析器（留空 = 自动仲裁）</label>
      <input id="parser" placeholder="domainlist">
      <div class="row" style="margin-top:10px">
        <button id="run">开始导入</button>
        <label style="margin:0;flex:0 0 auto"><input type="checkbox" id="dryrun"
          style="width:auto"> dry-run</label>
      </div>
      <div id="log" style="margin-top:10px"></div>
    </section>
  </div>
  <div>
    <section>
      <h2>实体</h2>
      <div class="row">
        <input id="kind" placeholder="kind（如 host）">
        <input id="q" placeholder="key 子串">
        <button id="refresh" style="flex:0 0 auto">刷新</button>
      </div>
      <ul id="entities" style="margin-top:10px"></ul>
    </section>
    <section style="margin-top:16px">
      <h2>详情</h2>
      <div id="detail" class="dim">点左边一个实体。</div>
    </section>
  </div>
</main>
<script>
"use strict";
// token 从 URL 拿：服务启动时打印的 URL 里带着它。
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const API = "/api/v1";

function headers(extra) {
  const h = Object.assign({"Authorization": "Bearer " + TOKEN}, extra || {});
  return h;
}
async function call(path, options) {
  const opts = Object.assign({headers: headers()}, options || {});
  const res = await fetch(API + path, opts);
  const body = await res.json().catch(() => ({ok: false, error: {message: res.statusText}}));
  if (!res.ok || body.ok === false) {
    const err = body.error || {};
    throw new Error((err.code || res.status) + ": " + (err.message || "请求失败") +
                    (err.hint ? "\n提示：" + err.hint : ""));
  }
  return body;
}
function el(id) { return document.getElementById(id); }
function esc(text) {
  return String(text === null || text === undefined ? "" : text)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function log(line, cls) {
  const div = document.createElement("div");
  if (cls) div.className = cls;
  div.textContent = line;
  el("log").appendChild(div);
  el("log").scrollTop = el("log").scrollHeight;
}

async function loadMeta() {
  try {
    const body = await call("/meta");
    const d = body.data;
    el("version").textContent = "v" + d.magpie_version + " · schema " + d.schema_version +
      " · 解析器 " + (d.parsers.map(p => p.tool + "@" + p.format_version).join(", ") || "无");
    const c = d.counts;
    el("stats").innerHTML = Object.keys(c).map(k =>
      "<div><b>" + c[k] + "</b>" + esc(k) + "</div>").join("");
  } catch (err) {
    el("version").innerHTML = '<span class="bad">' + esc(err.message) + "</span>";
  }
}

async function loadProjects() {
  const body = await call("/projects");
  const sel = el("project");
  sel.innerHTML = "";
  body.data.forEach(p => {
    const opt = document.createElement("option");
    opt.value = p.name;
    opt.textContent = p.name + "（" + p.counts.entities + " 实体）";
    sel.appendChild(opt);
  });
  if (!body.data.length) {
    const opt = document.createElement("option");
    opt.value = ""; opt.textContent = "（还没有项目，导入时会按 scope 建）";
    sel.appendChild(opt);
  }
}

async function loadEntities() {
  const params = new URLSearchParams({limit: "50"});
  if (el("kind").value) params.set("kind", el("kind").value);
  if (el("q").value) params.set("q", el("q").value);
  const body = await call("/entities?" + params.toString());
  const ul = el("entities");
  ul.innerHTML = "";
  body.data.forEach(e => {
    const li = document.createElement("li");
    li.innerHTML = '<span class="k">' + esc(e.entity_key) + "</span>" +
      '<span class="n">' + esc(e.kind) + " · " + e.observation_count + " 观测</span>";
    li.onclick = () => showEntity(e.id);
    ul.appendChild(li);
  });
  if (!body.data.length) ul.innerHTML = '<li class="dim">（没有匹配的实体）</li>';
}

async function showEntity(id) {
  const body = await call("/entities/" + id);
  const d = body.data;
  const parts = [];
  parts.push("<div><b>" + esc(d.entity.entity_key) + "</b> " +
             '<span class="tag">' + esc(d.entity.kind) + "</span> " +
             '<span class="tag">' + esc(d.entity.lifecycle) + "</span></div>");
  parts.push("<h2 style='margin-top:10px'>观测</h2><ul>" + (d.observations.map(o =>
    "<li><span class='k'>" + esc(o.semantic_field) + "</span><span class='n'>" +
    esc(o.value) + " · " + esc(o.confidence) + "</span></li>").join("") ||
    "<li class='dim'>（无）</li>") + "</ul>");
  parts.push("<h2 style='margin-top:10px'>关系</h2><ul>" + (d.relations.map(r =>
    "<li><span class='k'>" + (r.direction === "out" ? "→ " : "← ") + esc(r.rel) + " " +
    esc(r.other_key) + "</span></li>").join("") || "<li class='dim'>（无）</li>") + "</ul>");
  if (d.tags.length) parts.push("<div style='margin-top:8px'>标签：" +
    d.tags.map(t => '<span class="tag">' + esc(t) + "</span>").join(" ") + "</div>");
  el("detail").innerHTML = parts.join("");
}

function watchImport(importId) {
  // EventSource 发不了自定义头 —— token 只能走查询串（见文件头的说明 2）。
  const url = API + "/imports/" + importId + "/events?token=" + encodeURIComponent(TOKEN);
  const source = new EventSource(url);
  source.addEventListener("batch", event => {
    const payload = JSON.parse(event.data);
    if (payload.dropped) log("（队列满，丢了 " + payload.dropped + " 条事件）", "warn");
    payload.events.forEach(e => {
      const d = e.data || {};
      if (e.type === "progress") {
        log("进度 " + (d.file || "") + "：" + d.records + " 条记录 / " + d.line + " 行" +
            "，坏行 " + d.counts.bad_lines);
      } else if (e.type === "job_done") {
        log("作业 " + d.job_id + " 结束：" + d.state + "  " +
            JSON.stringify(d.counts), d.state === "done" ? "ok" : "warn");
      } else if (e.type === "done") {
        log("导入结束：" + d.state + "，job " + JSON.stringify(d.job_ids),
            d.state === "done" ? "ok" : "warn");
      } else if (e.type === "error") {
        log("出错：" + d.error, "bad");
      } else {
        log(e.type + " " + JSON.stringify(d).slice(0, 200));
      }
    });
    if (payload.events.some(e => e.terminal)) { source.close(); loadEntities(); loadMeta(); }
  });
  source.addEventListener("open", () => log("事件流已连上。"));
  source.onerror = () => { log("事件流断开。", "warn"); source.close(); };
}

el("run").onclick = async () => {
  const paths = el("paths").value.split("\n").map(s => s.trim()).filter(Boolean);
  if (!paths.length) { log("先填一个文件或目录。", "bad"); return; }
  const body = {paths: paths, dry_run: el("dryrun").checked};
  if (el("parser").value) body.parser = el("parser").value;
  if (el("project").value) body.project = el("project").value;
  try {
    const res = await call("/imports", {
      method: "POST", headers: headers({"Content-Type": "application/json"}),
      body: JSON.stringify(body),
    });
    log("已提交：" + res.data.import_id + "（" + paths.length + " 个路径）");
    watchImport(res.data.import_id);
  } catch (err) { log(err.message, "bad"); }
};
el("refresh").onclick = () => loadEntities();
el("kind").onkeydown = ev => { if (ev.key === "Enter") loadEntities(); };
el("q").onkeydown = ev => { if (ev.key === "Enter") loadEntities(); };

(async function boot() {
  if (!TOKEN) {
    el("version").innerHTML = '<span class="bad">URL 里没有 token。</span> ' +
      "请用 magpie app 打印的那条 URL 打开本页。";
    return;
  }
  await loadMeta();
  try { await loadProjects(); await loadEntities(); } catch (err) { log(err.message, "bad"); }
  el("notimpl").textContent =
    "尚未实现（返回 501）：搜索 / diff / 粘贴导入 / 管线编辑 —— 见计划书 §6.2 与 §8。";
})();
</script>
</body>
</html>
